<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ראייה מרחבית · שאלון 35372 · בגרות קיץ תשפ״ה 2025 · מועד ב׳</title>
<style>
/* ============================================================
   עיצוב כללי – כחול/לבן · RTL · רספונסיבי
   ---------------------------------------------------------------
   כלל קריטי: כל רשת / מטריצה / מבט עטופים ב-dir="ltr",
   כך שהעמודה השמאלית על המסך = עמודה 0 במטריצה תמיד.
   ============================================================ */
:root{
  --blue:#1d63b8; --blue-d:#13447f; --blue-l:#e8f1fb; --blue-ll:#f4f9ff;
  --ink:#16263b; --muted:#5a6b80; --line:#cdddf0;
  --ok:#1d8a4e; --ok-bg:#e7f6ee; --bad:#c0392b; --bad-bg:#fdecea;
  --warn:#a86512; --warn-bg:#fff3e0; --warn-line:#f0d8b0;
  --cell:#ffffff; --fill:#2f7fd1; --fill-line:#0e3f77; --shadow:0 6px 20px rgba(20,68,127,.08);
  --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Heebo","Arial Hebrew","Noto Naskh Arabic","Segoe UI Arabic",Tahoma,Arial,sans-serif;
  color:var(--ink); background:linear-gradient(180deg,#eef5fc,#f7fbff 240px);
  line-height:1.6; -webkit-text-size-adjust:100%;
}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px}

/* כותרת */
header.app{
  background:linear-gradient(135deg,var(--blue),var(--blue-d));
  color:#fff;border-radius:var(--radius);padding:22px 22px;box-shadow:var(--shadow);
}
header.app .kicker{font-size:.86rem;letter-spacing:.04em;opacity:.92;margin:0 0 4px}
header.app h1{margin:0;font-size:1.5rem;font-weight:800}
header.app p{margin:8px 0 0;opacity:.95;font-size:.96rem}
/* מתג שפה */
.langbar{display:flex;gap:8px;margin:0 0 12px}
.langbtn{font:inherit;font-weight:700;font-size:.86rem;cursor:pointer;padding:5px 16px;border-radius:20px;
  border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;transition:.15s}
.langbtn:hover{background:rgba(255,255,255,.25)}
.langbtn.active{background:#fff;color:var(--blue-d);border-color:#fff}
.progress{margin-top:14px;background:rgba(255,255,255,.25);height:9px;border-radius:9px;overflow:hidden}
.progress > i{display:block;height:100%;width:0;background:#fff;transition:width .4s ease}

/* כרטיס סעיף */
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin:18px 0;overflow:hidden;
}
.card > .head{
  display:flex;align-items:center;gap:10px;
  padding:14px 18px;background:var(--blue-ll);border-bottom:1px solid var(--line);
}
.badge{
  flex:0 0 auto;width:34px;height:34px;border-radius:50%;
  background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1rem;
}
.head h2{margin:0;font-size:1.12rem}
.body{padding:18px}
.q{background:var(--blue-l);border-inline-start:4px solid var(--blue);
   padding:10px 14px;border-radius:8px;margin:0 0 14px;font-size:.98rem}
.hint{font-size:.86rem;color:var(--muted);margin:6px 0 0}

/* תג תוצאה ליד כותרת הסעיף (✓ / ✗) — מופיע רק לאחר בדיקה */
.res-badge{display:none;margin-inline-start:auto;width:30px;height:30px;border-radius:50%;
  align-items:center;justify-content:center;font-weight:900;font-size:1.05rem}
.res-badge.show{display:inline-flex}
.res-badge.ok{background:var(--ok-bg);color:var(--ok);border:2px solid #bfe6cd}
.res-badge.bad{background:var(--bad-bg);color:var(--bad);border:2px solid #f3c6c0}

/* כפתורים */
.btn{
  font:inherit;cursor:pointer;border:1px solid var(--blue);background:#fff;color:var(--blue);
  padding:9px 16px;border-radius:10px;font-weight:700;transition:.15s;
}
.btn:hover{background:var(--blue-l)}
.btn:focus-visible{outline:3px solid #9cc4ee;outline-offset:2px}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.ghost:hover{background:#f3f7fc}
.btn.sm{padding:6px 12px;font-size:.86rem;border-radius:8px}
.btn.big{font-size:1.12rem;padding:13px 30px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}

/* תיבת קלט מספרי */
.numwrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input.num{
  width:90px;font:inherit;font-weight:800;text-align:center;font-size:1.15rem;
  padding:8px;border:2px solid var(--line);border-radius:10px;color:var(--blue-d);
}
input.num:focus{outline:none;border-color:var(--blue)}
input.num:disabled{background:#f3f7fc}

/* רשתות (תמיד LTR) */
.grid-host{direction:ltr;display:inline-block;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:8px}
.grid-cap{direction:rtl;text-align:center;font-size:.84rem;color:var(--muted);margin-top:6px}
table.grid{border-collapse:collapse}
table.grid td{
  width:38px;height:38px;border:1.5px solid #6f8cab;text-align:center;
  font-weight:800;font-size:1.05rem;color:var(--blue-d);cursor:pointer;
  user-select:none;background:var(--cell);transition:.1s;
}
table.grid.read td{cursor:default}
/* תא מלא: קווי הרשת נשארים כהים וברורים, כדי שתאים סמוכים לא ייראו כגוש אחד.
   ה-inset מצייר מסגרת בתוך התא עצמו — כך כל תא שומר על גבול נראה גם בצמידות. */
table.grid td.on{background:var(--fill);color:#fff;border-color:var(--fill-line);
  box-shadow:inset 0 0 0 1px var(--fill-line)}
table.grid td.num{cursor:pointer}
table.grid td.z0{color:#b9c6d6}            /* גובה 0 – חיוור */
table.grid.locked td{pointer-events:none;cursor:default}
.legend{direction:rtl;font-size:.8rem;color:var(--muted);margin-top:6px}

/* בחירה (סעיף ג3) */
#g3-choices.locked button{pointer-events:none;opacity:.92}

/* משוב לכל סעיף — מוסתר עד לחיצה על 'בדוק תשובות' */
.feedback{margin-top:14px;border-radius:10px;padding:12px 14px;display:none;font-size:.96rem}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-bg);border:1px solid #bfe6cd;color:var(--ok)}
.incomplete-note{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid var(--warn-line);border-radius:10px;background:var(--warn-bg);color:var(--warn);font-weight:700}
.incomplete-note.show{display:block}
.feedback.bad{background:var(--bad-bg);border:1px solid #f3c6c0;color:var(--bad)}
.feedback .exp{display:block;margin-top:8px;color:var(--ink);font-size:.9rem}

/* אזור עזרה לסעיף — מופיע רק ליד סעיפים שגויים */
.help{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.help.show{display:block}

/* תלת-ממד */
.viewer{display:none;margin-top:12px;border:1px solid var(--line);border-radius:12px;
  background:linear-gradient(180deg,#fbfdff,#f1f7fe);overflow:hidden}
.viewer.show{display:block}
.viewer canvas{width:100%;height:340px;display:block;touch-action:none;cursor:grab}
.viewer canvas:active{cursor:grabbing}
.viewer .vbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;
  padding:10px 12px;border-top:1px solid var(--line);background:#fff}
.viewer .vbar .sp{margin-inline-start:auto;font-size:.82rem;color:var(--muted)}

/* תמונת השאלה */
.exam-img{display:block;max-width:300px;width:100%;margin:0 auto;border:1px solid var(--line);
  border-radius:12px;background:#fff;padding:8px}
.figcap{text-align:center;font-size:.84rem;color:var(--muted);margin-top:6px}

/* סנדבוקס – רשת הוספה */
.sandbox-grid{direction:ltr;display:inline-block}
table.add td{width:42px;height:42px;border:1.5px solid #6f8cab;text-align:center;
  font-weight:800;color:var(--blue-d);cursor:pointer;background:#fff;font-size:1.05rem}
table.add td:hover{background:var(--blue-l)}
.counter{font-weight:800;color:var(--blue-d)}

/* בלוק הבדיקה הכללי */
.checkbar{text-align:center}
.warn{display:none;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);
  border-radius:10px;padding:12px 14px;margin:0 0 14px;font-weight:700}
.warn.show{display:block}
.score{display:none;font-size:1.08rem;color:var(--ink);margin:0 0 14px}
.score.show{display:block}
.score.all{color:var(--ok);font-weight:800}
.score b{color:var(--blue-d)}

/* מסך סיום */
.summary{display:none}
.summary.show{display:block}
.stat-row{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 16px}
.done-msg{background:var(--ok-bg);border:1px solid #bfe6cd;color:var(--ok);border-radius:10px;padding:14px 16px;font-weight:700;font-size:1.02rem;margin:0 0 14px}
.stat{flex:1 1 150px;background:var(--blue-l);border:1px solid var(--line);
  border-radius:12px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.7rem;color:var(--blue-d)}
.stat span{font-size:.82rem;color:var(--muted)}
textarea.reflect{width:100%;min-height:90px;font:inherit;padding:10px;border:1.5px solid var(--line);
  border-radius:10px;resize:vertical}
textarea.reflect:focus{outline:none;border-color:var(--blue)}

@media (max-width:560px){
  table.grid td{width:32px;height:32px;font-size:.95rem}
  table.add td{width:38px;height:38px}
  header.app h1{font-size:1.25rem}
}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}

<script>
/* ============================================================
   מנוע מרכזי – מטריצת גבהים וחישוב מבטים
   ------------------------------------------------------------
   ייצוג: H[row][col]
     row 0 = השורה האחורית · row 2 = השורה הקדמית (מול הצופה / החץ)
     col 0 = השמאלית ביותר · col 3 = הימנית ביותר
   כל המבטים מחושבים מהמטריצה — ללא קידוד ידני.
============================================================ */
const ROWS=3, COLS=4, MAXH=3;
const byId = id => document.getElementById(id);

/* מבנה מקורי (מטריצת הגבהים המדויקת — מקור האמת) */
const ORIGINAL = [
  [2,1,3,2],   // אחורית  (row 0)
  [1,1,1,1],   // אמצעית  (row 1)
  [2,1,1,2]    // קדמית   (row 2)
];

/* ---- פונקציות מבט (מחושבות) ---- */
function colMax(H){const a=[];for(let c=0;c<COLS;c++){let m=0;for(let r=0;r<ROWS;r++)m=Math.max(m,H[r][c]);a.push(m);}return a;}
function rowMax(H){const a=[];for(let r=0;r<ROWS;r++){let m=0;for(let c=0;c<COLS;c++)m=Math.max(m,H[r][c]);a.push(m);}return a;}
function frontHeights(H){return colMax(H);}                    /* מבט מלפנים */
function rightHeights(H){const m=rowMax(H);return [m[2],m[1],m[0]];} /* מימין: מהחזית לאחור */
function silhouette(heights,maxh){
  const g=[];
  for(let h=maxh;h>=1;h--){const row=[];for(let c=0;c<heights.length;c++)row.push(heights[c]>=h?1:0);g.push(row);}
  return g;
}
function eq2(a,b){if(a.length!==b.length)return false;for(let i=0;i<a.length;i++){if(a[i].length!==b[i].length)return false;for(let j=0;j<a[i].length;j++)if(a[i][j]!==b[i][j])return false;}return true;}

/* תשובות נכונות מחושבות */
const ANS_FRONT = silhouette(frontHeights(ORIGINAL), MAXH);   // 3×4
const ANS_RIGHT = silhouette(rightHeights(ORIGINAL), MAXH);   // 3×3
const RM = rowMax(ORIGINAL);                                   // [3,1,2]
const MAXFILL = ORIGINAL.map((row,r)=>row.map(()=>RM[r]));     // [[3,3,3,3],[1,1,1,1],[2,2,2,2]]
const ORIG_TOTAL = ORIGINAL.flat().reduce((a,b)=>a+b,0);       // 18
const MAXFILL_TOTAL = MAXFILL.flat().reduce((a,b)=>a+b,0);     // 24
const ADD_ANSWER = MAXFILL_TOTAL - ORIG_TOTAL;                 // 6

/* ---- מצב הסעיפים ---- */
const KEYS=['a','b','g1','g2','g3'];
const state={}; KEYS.forEach(k=>state[k]={ok:null, attempts:0});
let modelUnlocked=false;   /* המודל התלת-ממדי נפתח כשסעיף כלשהו מגיע לניסיון 2 */
const startTime=Date.now();

/* ============================================================
   רשתות אינטראקטיביות (LTR · עמודה שמאלית = עמודה 0)
============================================================ */
function buildToggleGrid(tableId, rows, cols){
  const t=byId(tableId); t.innerHTML='';
  for(let r=0;r<rows;r++){
    const tr=t.insertRow();
    for(let c=0;c<cols;c++){
      const td=tr.insertCell(); td.dataset.r=r; td.dataset.c=c;
      td.onclick=()=>td.classList.toggle('on');
    }
  }
}
function readToggle(tableId){
  const t=byId(tableId), g=[];
  for(const tr of t.rows){const row=[];for(const td of tr.cells)row.push(td.classList.contains('on')?1:0);g.push(row);}
  return g;
}
function paintToggle(tableId,grid){
  const t=byId(tableId);
  for(let r=0;r<t.rows.length;r++)for(let c=0;c<t.rows[r].cells.length;c++)
    t.rows[r].cells[c].classList.toggle('on', grid[r][c]===1);
}
function buildNumGrid(tableId, rows, cols){
  const t=byId(tableId); t.innerHTML='';
  for(let r=0;r<rows;r++){
    const tr=t.insertRow();
    for(let c=0;c<cols;c++){
      const td=tr.insertCell(); td.className='num z0'; td.textContent='0';
      td.onclick=()=>{let v=(+td.textContent+1)%(MAXH+1);td.textContent=v;td.classList.toggle('z0',v===0);};
    }
  }
}
function readNum(tableId){
  const t=byId(tableId),g=[];
  for(const tr of t.rows){const row=[];for(const td of tr.cells)row.push(+td.textContent);g.push(row);}
  return g;
}
function paintNum(tableId,grid){
  const t=byId(tableId);
  for(let r=0;r<t.rows.length;r++)for(let c=0;c<t.rows[r].cells.length;c++){
    const td=t.rows[r].cells[c]; td.textContent=grid[r][c]; td.classList.toggle('z0',grid[r][c]===0);
  }
}

let LANG = 'he';
/* t(key) – שליפת מחרוזת בשפה הפעילה */
function t(key){ const v = I18N[LANG][key]; return v===undefined ? '' : v; }

/* החלפת שפה: מעדכן את כל הטקסטים בדף מבלי לאבד את מצב הפתרון */
function setLang(lang){
  if(!I18N[lang]) return;
  LANG = lang;
  document.documentElement.lang = lang;      /* dir נשאר rtl בשתי השפות */
  document.title = t('title');

  /* כל אלמנט עם data-i18n */
  const nodes = document.querySelectorAll('[data-i18n]');
  for(const el of nodes){ el.innerHTML = t(el.dataset.i18n); }

  /* טקסטים שאינם innerHTML */
  const img=byId('examImg'); if(img) img.alt=t('img_alt');
  const ta=byId('reflect');  if(ta)  ta.placeholder=t('reflect_ph');

  /* כפתורי מתג השפה */
  byId('lang-he').classList.toggle('active', lang==='he');
  byId('lang-ar').classList.toggle('active', lang==='ar');

  /* כפתור עזרה שנפתח – יש להחזיר לו את תווית ה"הסתר" */
  KEYS.forEach(k=>{
    const box=byId('viewer-'+k);
    if(box && box.classList.contains('show')){
      const btn=byId('help-'+k).querySelector('[data-help]');
      if(btn) btn.innerHTML=t('btn_help_close');
    }
  });

  /* רכיבי סביבת החקר (מונה הקוביות) */
  for(const k in HELP){ if(HELP[k].relabel) HELP[k].relabel(); }

  /* הודעות דינמיות שכבר מוצגות – ציור מחדש בשפה החדשה */
  refreshDynamic();
  document.dispatchEvent(new CustomEvent('lab:languagechange',{detail:{lang:LANG}}));
}

/* ציור מחדש של המשוב לאחר החלפת שפה — לפי מצב הסעיפים בלבד */
function refreshDynamic(){
  KEYS.forEach(k=>{
    const fb=byId('fb-'+k);
    if(state[k].ok===null || !fb.classList.contains('show')) return;
    showFeedback(k);
  });
  if(byId('summaryCard').classList.contains('show')) byId('doneMsg').innerHTML=t('complete_msg');
}

/* ============================================================
   מנוע תלת־ממד (Canvas · אורתוגרפי · גרירה/זום)
============================================================ */
function makeViewer(canvas, initialH, baseH){
  const ctx=canvas.getContext('2d');
  let H=initialH.map(r=>r.slice());
  let base = baseH ? baseH.map(r=>r.slice()) : null;  // קוביות שנוספו מעל המקור נצבעות אחרת
  const def={yaw:-0.62, pitch:0.52, zoom:1};
  let yaw=def.yaw, pitch=def.pitch, zoom=def.zoom;
  let drag=false, lx=0, ly=0;

  function rot(p){
    let {x,y,z}=p;
    let x1=x*Math.cos(yaw)+z*Math.sin(yaw);
    let z1=-x*Math.sin(yaw)+z*Math.cos(yaw);
    let y1=y;
    let y2=y1*Math.cos(pitch)-z1*Math.sin(pitch);
    let z2=y1*Math.sin(pitch)+z1*Math.cos(pitch);
    return {x:x1,y:y2,z:z2};
  }
  function project(p,W,Ht,scale){return {sx:W/2+p.x*scale, sy:Ht/2-p.y*scale, depth:p.z};}
  const PAL_ORIG={top:'#fbfcfe',bottom:'#9aa6b4',front:'#e3e9f1',back:'#cdd6e1',right:'#aeb9c7',left:'#c4ccd8'};
  const PAL_ADD ={top:'#dcecff',bottom:'#5b86b0',front:'#bcdcfa',back:'#a3c6ee',right:'#6ca2db',left:'#92bdec'};
  function cubeFaces(cx,cy,cz,added){
    const v=(dx,dy,dz)=>({x:cx+dx,y:cy+dy,z:cz+dz});
    const P=added?PAL_ADD:PAL_ORIG;
    return [
      {n:{x:0,y:1,z:0}, p:[v(-.5,.5,-.5),v(.5,.5,-.5),v(.5,.5,.5),v(-.5,.5,.5)], shade:P.top},
      {n:{x:0,y:-1,z:0},p:[v(-.5,-.5,-.5),v(.5,-.5,-.5),v(.5,-.5,.5),v(-.5,-.5,.5)],shade:P.bottom},
      {n:{x:0,y:0,z:1}, p:[v(-.5,-.5,.5),v(.5,-.5,.5),v(.5,.5,.5),v(-.5,.5,.5)], shade:P.front},
      {n:{x:0,y:0,z:-1},p:[v(-.5,-.5,-.5),v(.5,-.5,-.5),v(.5,.5,-.5),v(-.5,.5,-.5)],shade:P.back},
      {n:{x:1,y:0,z:0}, p:[v(.5,-.5,-.5),v(.5,-.5,.5),v(.5,.5,.5),v(.5,.5,-.5)], shade:P.right},
      {n:{x:-1,y:0,z:0},p:[v(-.5,-.5,-.5),v(-.5,-.5,.5),v(-.5,.5,.5),v(-.5,.5,-.5)],shade:P.left}
    ];
  }
  function draw(){
    const dpr=window.devicePixelRatio||1;
    const W=canvas.clientWidth, Ht=canvas.clientHeight;
    canvas.width=W*dpr; canvas.height=Ht*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,Ht);
    const cx=(COLS-1)/2, cz=(ROWS-1)/2;
    let maxLayer=0; for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)maxLayer=Math.max(maxLayer,H[r][c]);
    const cy=maxLayer/2;
    const span=Math.max(COLS,ROWS,maxLayer)+2.4;
    const scale=Math.min(W,Ht)/span*1.05*zoom;

    const faces=[];
    (function tray(){
      const m=0.62, yb=-0.55;
      const corners=[{x:-cx-m,y:yb,z:-cz-m},{x:COLS-1-cx+m,y:yb,z:-cz-m},
                     {x:COLS-1-cx+m,y:yb,z:ROWS-1-cz+m},{x:-cx-m,y:yb,z:ROWS-1-cz+m}];
      const pr=corners.map(p=>project(rot(p),W,Ht,scale));
      faces.push({depth:Math.min(...corners.map(p=>rot(p).z))-0.01, pts:pr, fill:'#eef2f7', stroke:'#d4dde8'});
    })();
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const h=H[r][c];
      for(let y=0;y<h;y++){
        const wx=c-cx, wy=y-cy+0.5, wz=r-cz;
        const isAdded = base && y >= base[r][c];
        for(const f of cubeFaces(wx,wy,wz,isAdded)){
          const {z}=rot({x:f.n.x,y:f.n.y,z:f.n.z});
          if(z<=0.0001) continue;                     // גיזום פאות אחוריות
          const pr=f.p.map(p=>project(rot(p),W,Ht,scale));
          const dep=f.p.reduce((s,p)=>s+rot(p).z,0)/4;
          faces.push({depth:dep, pts:pr, fill:f.shade, stroke:isAdded?'#3f6ea5':'#566378'});
        }
      }
    }
    const arrow=(function(){
      const z0=ROWS-1-cz+1.15, z1=ROWS-1-cz+0.35, xx=0; const yb=-0.5;
      const shaft=[{x:xx,y:yb,z:z0},{x:xx,y:yb,z:z1}];
      const head=[{x:xx-0.28,y:yb,z:z1+0.34},{x:xx,y:yb,z:z1},{x:xx+0.28,y:yb,z:z1+0.34}];
      return {shaft:shaft.map(p=>project(rot(p),W,Ht,scale)), head:head.map(p=>project(rot(p),W,Ht,scale))};
    })();

    faces.sort((a,b)=>a.depth-b.depth);               // ציור מאחור לפנים
    for(const f of faces){
      ctx.beginPath(); ctx.moveTo(f.pts[0].sx,f.pts[0].sy);
      for(let i=1;i<f.pts.length;i++)ctx.lineTo(f.pts[i].sx,f.pts[i].sy);
      ctx.closePath();
      ctx.fillStyle=f.fill; ctx.fill();
      ctx.lineWidth=1; ctx.strokeStyle=f.stroke||'#566378'; ctx.stroke();
    }
    ctx.strokeStyle='#e8821e'; ctx.fillStyle='#e8821e'; ctx.lineWidth=3; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(arrow.shaft[0].sx,arrow.shaft[0].sy);
    ctx.lineTo(arrow.shaft[1].sx,arrow.shaft[1].sy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(arrow.head[0].sx,arrow.head[0].sy);
    ctx.lineTo(arrow.head[1].sx,arrow.head[1].sy); ctx.lineTo(arrow.head[2].sx,arrow.head[2].sy);
    ctx.closePath(); ctx.fill();
  }

  function down(e){drag=true;const p=pt(e);lx=p.x;ly=p.y;}
  function move(e){if(!drag)return;const p=pt(e);yaw+=(p.x-lx)*0.01;pitch+=(p.y-ly)*0.01;
    pitch=Math.max(0.12,Math.min(1.35,pitch));lx=p.x;ly=p.y;draw();e.preventDefault();}
  function up(){drag=false;}
  function pt(e){const r=canvas.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return {x:t.clientX-r.left,y:t.clientY-r.top};}
  function wheel(e){zoom*=(e.deltaY<0?1.1:0.9);zoom=Math.max(0.4,Math.min(3,zoom));draw();e.preventDefault();}
  let pinch=0;
  function tmove(e){
    if(e.touches&&e.touches.length===2){
      const dx=e.touches[0].clientX-e.touches[1].clientX, dy=e.touches[0].clientY-e.touches[1].clientY;
      const d=Math.hypot(dx,dy); if(pinch){zoom*=d/pinch;zoom=Math.max(0.4,Math.min(3,zoom));draw();} pinch=d; e.preventDefault();
    } else move(e);
  }
  canvas.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  canvas.addEventListener('wheel',wheel,{passive:false});
  canvas.addEventListener('touchstart',e=>{if(e.touches.length===1)down(e);},{passive:false});
  canvas.addEventListener('touchmove',tmove,{passive:false});
  canvas.addEventListener('touchend',()=>{up();pinch=0;});

  return {
    draw,
    reset(){yaw=def.yaw;pitch=def.pitch;zoom=def.zoom;draw();},
    setH(nh){H=nh.map(r=>r.slice());draw();}
  };
}

/* ============================================================
   עזרי תלת־ממד לכל סעיף (נבנים פעם אחת, מצוירים בפתיחה בלבד)
============================================================ */
/* עזר סטטי: תצוגת מבנה לסיבוב/זום בלבד */
function makeStatic(host, H){
  host.innerHTML =
    '<canvas></canvas>'+
    '<div class="vbar">'+
      '<button class="btn sm" data-act="rv" data-i18n="btn_reset_view"></button>'+
      '<span class="sp" data-i18n="viewer_hint"></span>'+
    '</div>';
  const canvas=host.querySelector('canvas');
  let viewer=null;
  host.querySelector('[data-act=rv]').onclick=()=>viewer&&viewer.reset();
  return {
    ensureViewer(){ if(!viewer)viewer=makeViewer(canvas,H); requestAnimationFrame(()=>viewer.draw()); },
    draw(){viewer&&viewer.draw();}
  };
}
/* סביבת חקר: הוספת קוביות + עדכון תלת־ממד בזמן אמת (מצב עצמאי לכל מופע) */
function makeSandbox(host){
  host.innerHTML =
    '<canvas></canvas>'+
    '<div class="vbar" style="flex-direction:column;align-items:stretch;gap:12px">'+
      '<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">'+
        '<button class="btn sm" data-act="rv" data-i18n="btn_reset_view"></button>'+
        '<button class="btn sm" data-act="undo" data-i18n="btn_undo"></button>'+
        '<button class="btn sm ghost" data-act="rs" data-i18n="btn_reset_struct"></button>'+
        '<span class="sp sb-count"></span>'+
      '</div>'+
      '<div>'+
        '<div style="font-size:.84rem;color:var(--muted);margin-bottom:6px" data-i18n="sb_hint">'+
          '</div>'+
        '<div class="sandbox-grid"><table class="add"></table></div>'+
      '</div>'+
    '</div>';
  const canvas=host.querySelector('canvas');
  const table=host.querySelector('table.add');
  const countBox=host.querySelector('.sb-count');
  let added=ORIGINAL.map(r=>r.map(()=>0));
  let hist=[];
  let viewer=null;
  const curH=()=>ORIGINAL.map((row,r)=>row.map((v,c)=>v+added[r][c]));
  function repaint(){
    const H=curH();
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)table.rows[r].cells[c].textContent=H[r][c];
    renderCount();
    if(viewer)viewer.setH(curH());
  }
  function renderCount(){
    const n=added.flat().reduce((a,b)=>a+b,0);
    countBox.innerHTML=t('sb_added_tpl').replace('{n}','<span class="counter">'+n+'</span>');
  }
  for(let r=0;r<ROWS;r++){const tr=table.insertRow();for(let c=0;c<COLS;c++){const td=tr.insertCell();
    td.onclick=()=>{added[r][c]++;hist.push([r,c]);repaint();};}}
  host.querySelector('[data-act=rv]').onclick=()=>viewer&&viewer.reset();
  host.querySelector('[data-act=undo]').onclick=()=>{if(hist.length){const [r,c]=hist.pop();added[r][c]=Math.max(0,added[r][c]-1);repaint();}};
  host.querySelector('[data-act=rs]').onclick=()=>{added=ORIGINAL.map(r=>r.map(()=>0));hist=[];repaint();};
  repaint();
  return {
    ensureViewer(){ if(!viewer)viewer=makeViewer(canvas,curH(),ORIGINAL); requestAnimationFrame(()=>viewer.draw()); },
    draw(){viewer&&viewer.draw();},
    relabel(){renderCount();}
  };
}

const HELP={};
HELP.a  = makeStatic(byId('host-a'),  ORIGINAL);
HELP.b  = makeStatic(byId('host-b'),  ORIGINAL);
HELP.g1 = makeSandbox(byId('host-g1'));
HELP.g2 = makeSandbox(byId('host-g2'));
HELP.g3 = makeStatic(byId('host-g3'), ORIGINAL);

function toggleHelp(key){
  const box=byId('viewer-'+key);
  const open=box.classList.toggle('show');
  const btn=byId('help-'+key).querySelector('[data-help]');
  if(btn)btn.innerHTML = open ? t('btn_help_close') : t(btn.dataset.i18n);
  if(open)HELP[key].ensureViewer();
}
window.addEventListener('resize',()=>{for(const k in HELP)HELP[k].draw();});

   סעיף ג(3) – בחירה יחידה
============================================================ */
/* סדר האפשרויות זהה לנוסח הבגרות: משמאל, מלפנים, מאחור */
const G3_OPTIONS=[{key:'left'},{key:'front'},{key:'back'}];
let g3pick=null;
(function buildG3(){
  const host=byId('g3-choices');
  G3_OPTIONS.forEach(o=>{
    const b=document.createElement('button');
    b.className='btn'; b.style.justifyContent='flex-start';
    b.dataset.i18n='opt_'+o.key; b.innerHTML=t('opt_'+o.key);
    b.onclick=()=>{
      if(host.classList.contains('locked'))return;
      g3pick=o.key;
      [...host.children].forEach(x=>x.classList.remove('primary'));
      b.classList.add('primary');
      sectionDirty('g3');
    };
    host.appendChild(b);
  });
})();

/* ============================================================
   מצב, בדיקה כללית ומשוב
============================================================ */

/* בדיקה אם סעיף נענה (יש קלט כלשהו) */
function isAnswered(k){
  if(k==='a') return readToggle('grid-a').flat().some(v=>v===1);
  if(k==='b') return readToggle('grid-b').flat().some(v=>v===1);
  if(k==='g1'){const v=byId('g1-input').value.trim(); return v!=='' && isFinite(+v);}
  if(k==='g2') return readNum('grid-g2').flat().some(v=>v>0);
  if(k==='g3') return g3pick!==null;
}
/* הערכת נכונות */
function evaluate(k){
  if(k==='a') return eq2(readToggle('grid-a'),ANS_FRONT);
  if(k==='b') return eq2(readToggle('grid-b'),ANS_RIGHT);
  if(k==='g1') return +byId('g1-input').value===ADD_ANSWER;
  if(k==='g2') return eq2(readNum('grid-g2'),MAXFILL);
  if(k==='g3') return g3pick==='left';
}

function setBadge(k,ok){const b=byId('badge-'+k);b.textContent=ok?'✓':'✗';b.className='res-badge show '+(ok?'ok':'bad');}
function clearBadge(k){const b=byId('badge-'+k);b.textContent='';b.className='res-badge';}

function lockSection(k,lock){
  if(k==='a'||k==='b'||k==='g2') byId('grid-'+k).classList.toggle('locked',lock);
  if(k==='g1') byId('g1-input').disabled=lock;
  if(k==='g3') byId('g3-choices').classList.toggle('locked',lock);
}

/* ניקוי התצוגה של סעיף (התג + המשוב + העזרה). מונה הניסיונות נשמר. */
function clearSectionResult(k){
  clearBadge(k);
  byId('fb-'+k).className='feedback';
  byId('help-'+k).classList.remove('show');
  byId('viewer-'+k).classList.remove('show');
  lockSection(k,false);
  state[k].ok=null;   /* התצוגה מתאפסת; state[k].attempts נשמר */
}

/* עריכת סעיף לאחר בדיקה — מסתירה את המשוב הישן שלו ואת הודעת הסיום.
   מונה הניסיונות אינו מתאפס (ההסלמה נספרת לפי מספר ההגשות). */
function sectionDirty(k){
  clearSectionResult(k);
  byId('summaryCard').classList.remove('show');
}

/* מאזינים ברמת הרשת (נשמרים גם לאחר בנייה מחדש של התאים) */
byId('grid-a').addEventListener('click',()=>sectionDirty('a'));
byId('grid-b').addEventListener('click',()=>sectionDirty('b'));
byId('grid-g2').addEventListener('click',()=>sectionDirty('g2'));
byId('g1-input').addEventListener('input',()=>sectionDirty('g1'));

/* טקסט המשוב של סעיף — לפי מצבו ומונה הניסיונות שלו */
function fbBody(k){
  const a=state[k].attempts;
  if(a<=1) return t('try1');
  if(a===2) return t('try2');
  return I18N[LANG].try3[k];        /* ניסיון 3 ואילך — קבוע לאותו סעיף */
}
function showFeedback(k){
  const fb=byId('fb-'+k);
  if(state[k].ok){
    fb.className='feedback show ok';
    fb.innerHTML='<b>'+t('sec_ok')+'</b>';          /* "הסעיף נכון." — ללא חשיפת תשובה */
  }else{
    fb.className='feedback show bad';
    fb.innerHTML=fbBody(k);                          /* סימון בינארי + טקסט לפי ניסיון */
  }
}

/* ---- הכפתור המרכזי ---- */
function checkAll(){
  const missing=KEYS.filter(k=>!isAnswered(k));
  const note=byId('incomplete-note');
  if(missing.length){
    missing.forEach(k=>clearSectionResult(k));
    note.textContent=t('incomplete').replace('{items}',missing.map(k=>I18N[LANG].lbl[k]).join(t('sep')));
    note.classList.add('show');
    note.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  note.classList.remove('show');
  note.textContent='';
  KEYS.forEach(k=>{
    const ok=evaluate(k);
    if(ok){
      state[k].ok=true;                    /* סעיף נכון — אין מנייה, אין חשיפת תשובה */
      setBadge(k,true);
      showFeedback(k);
      byId('help-'+k).classList.remove('show');
      byId('viewer-'+k).classList.remove('show');
      lockSection(k,true);
    }else{
      state[k].ok=false;
      state[k].attempts++;                 /* הגשה שגויה של הסעיף — קידום המונה שלו */
      if(state[k].attempts>=2) modelUnlocked=true;  /* פתיחת המודל התלת-ממדי */
      setBadge(k,false);
      showFeedback(k);
      lockSection(k,false);
    }
  });

  /* המודל התלת-ממדי זמין ליד כל סעיף שגוי, מרגע שנפתח */
  KEYS.forEach(k=>{
    if(state[k].ok===false && modelUnlocked) byId('help-'+k).classList.add('show');
  });

  /* סיום השאלה — רק כשכל הסעיפים נכונים */
  if(KEYS.every(k=>state[k].ok===true)) showComplete();
  else byId('summaryCard').classList.remove('show');
}

/* הודעת סיום השאלה (כל הסעיפים נכונים) */
function showComplete(){
  byId('doneMsg').innerHTML=t('complete_msg');
  byId('summaryCard').classList.add('show');
  byId('summaryCard').scrollIntoView({behavior:'smooth'});
}
